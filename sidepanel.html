<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>ClearVoice</title>
    <style>
        body {
            font-family: system-ui, Arial, sans-serif;
            margin: 12px;
        }

        h2 {
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 140px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            cursor: pointer;
        }

        .note {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <h2>ClearVoice</h2>

    <textarea id="input" placeholder="Selected text will appear here..."></textarea>

    <button id="useSelectionBtn">Use Selected Text</button>
    <button id="testBtn">Test Panel</button>

    <div class="note">
        Highlight text on a webpage, then click "Use Selected Text".
    </div>

    <script src="sidepanel.js"></script>
</body>

</html>
